
[package]
name = "rust_serverless_runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.6.20"
deno_core = "=0.150.0"
rusqlite = { version = "=0.28.0", features = ["bundled"] }
tokio = { version = "=1.28.2", features = ["full"] }
